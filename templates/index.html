<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08050f">
  <title>Список задач</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Список задач</h1>
    <p class="subtitle">Планируйте день и ничего не забывайте</p>

    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <p class="counter" id="counter"></p>

    <form id="add-form" autocomplete="off">
      <input id="title" type="text" maxlength="200" placeholder="Что нужно сделать?" required>
      <button type="submit">Добавить</button>
    </form>
    <p class="error" id="error" role="alert" hidden></p>

    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Задач пока нет. Добавьте первую!</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
